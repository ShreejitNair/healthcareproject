name: CI-CD-Pipeline

on:
  push:
    branches:
      - master

env:
  DOCKER_IMAGE: shreejitnair2000/staragileprojecthealthcare

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # -----------------------------------------------------------------
    # 1. SETUP & CODE QUALITY
    # -----------------------------------------------------------------
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Application
      run: mvn clean install

    - name: Run Tests
      run: mvn test

    # -----------------------------------------------------------------
    # 2. DOCKER BUILD & PUBLISH
    # -----------------------------------------------------------------
    - name: Docker Hub Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t $DOCKER_IMAGE:${{ github.sha }} -t $DOCKER_IMAGE:latest .

    - name: Push Docker Image
      run: docker push --all-tags $DOCKER_IMAGE

    # -----------------------------------------------------------------
    # 3. SIMPLIFIED KUBERNETES DEPLOYMENT
    # -----------------------------------------------------------------
    - name: Deploy to Kubernetes
      uses: steebchen/kubectl@master
      with:
        config: ${{ secrets.KUBE_CONFIG }}
        command: apply -f deploymentservice.yaml
